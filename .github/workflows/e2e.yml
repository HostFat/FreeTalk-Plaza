name: E2E

# Run after the Rust workflow so the contract bundle, the target WASMs and the
# stylesheet can be downloaded instead of rebuilt on a second runner.
on:
  workflow_run:
    workflows: ["Rust"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  playwright:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

    # Nix supplies dx and the pinned Rust toolchain.
    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable

    # Playwright itself runs on the runner's Node.
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: ui/tests/package-lock.json

    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('ui/tests/package-lock.json') }}
        restore-keys: playwright-${{ runner.os }}-

    - name: Install test dependencies and browsers
      working-directory: ui/tests
      run: |
        npm ci
        npx playwright install --with-deps chromium firefox webkit

    # The example UI is still built here, but it reuses the dependency cache.
    - name: Cache the Dioxus build
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: e2e-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml', 'flake.lock') }}
        restore-keys: e2e-${{ runner.os }}-

    - name: Download contract bundle
      id: download-contracts
      if: github.event_name == 'workflow_run'
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        name: contracts
        path: ui/public/contracts
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Download target WASMs
      id: download-target
      if: github.event_name == 'workflow_run'
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        name: wasm-target
        path: target/wasm32-unknown-unknown/release
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Download stylesheet
      id: download-styles
      if: github.event_name == 'workflow_run'
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        name: styles
        path: ui/assets
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}

    # A manual run has no upstream artifacts. The same fallback covers a Rust
    # run from before this workflow started uploading them.
    - name: Build contracts and stylesheet when the artifacts are missing
      if: >-
        github.event_name == 'workflow_dispatch'
        || steps.download-contracts.outcome != 'success'
        || steps.download-target.outcome != 'success'
        || steps.download-styles.outcome != 'success'
      run: |
        nix develop --command cargo run --quiet --manifest-path tools/wasm-tool/Cargo.toml -- sync
        npm --prefix ui ci
        npm --prefix ui run build:css

    # Run the Node process outside Nix: WebKit crashes when it inherits the
    # Nix dev shell's library paths. Only dx needs the shell.
    - name: Create the dx wrapper
      run: |
        cat > "$RUNNER_TEMP/dx-nix" <<'EOF'
        #!/usr/bin/env bash
        exec nix develop "$GITHUB_WORKSPACE" --command dx "$@"
        EOF
        chmod +x "$RUNNER_TEMP/dx-nix"

    - name: Run Playwright
      working-directory: ui/tests
      env:
        CI: "true"
        DX_BIN: ${{ runner.temp }}/dx-nix
      run: npx playwright test

    - name: Upload Playwright report
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: |
          ui/tests/playwright-report
          ui/tests/test-results
        retention-days: 7
