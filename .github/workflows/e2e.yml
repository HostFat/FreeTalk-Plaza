name: E2E

# Standalone manual E2E workflow (full browser matrix or Chromium-only).
# Push and PR E2E now runs directly inside `.github/workflows/rust.yml` in
# parallel with `test` and `ui` right after `wasms` completes.
on:
  workflow_dispatch:
    inputs:
      project:
        description: "Playwright project (empty = full browser matrix)"
        type: choice
        default: ""
        options:
          - ""
          - chromium
          - firefox
          - webkit
          - mobile-chrome

permissions:
  contents: read

concurrency:
  group: e2e-manual-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v6

    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        github_access_token: ${{ secrets.GITHUB_TOKEN }}

    - uses: nix-community/cache-nix-action@v7
      with:
        primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-
        gc-max-store-size-linux: 2G

    - uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: ui/tests/package-lock.json

    - name: Cache Playwright browsers
      uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ inputs.project || 'all' }}-${{ hashFiles('ui/tests/package-lock.json') }}
        restore-keys: playwright-${{ runner.os }}-

    - name: Install test dependencies and browsers
      working-directory: ui/tests
      run: |
        npm ci
        case "${{ inputs.project }}" in
          chromium|mobile-chrome)
            npx playwright install --with-deps chromium
            ;;
          firefox)
            npx playwright install --with-deps firefox
            ;;
          webkit)
            npx playwright install --with-deps webkit
            ;;
          *)
            npx playwright install --with-deps chromium firefox webkit
            ;;
        esac

    - name: Cache the Dioxus build
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: e2e-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml', 'flake.lock') }}
        restore-keys: e2e-${{ runner.os }}-

    - name: Build contracts and stylesheet
      run: |
        nix develop --command cargo run --quiet --manifest-path tools/wasm-tool/Cargo.toml -- sync
        nix develop --command npm --prefix ui install --no-audit --no-fund
        nix develop --command npm --prefix ui run build:css

    # Run the Node process outside Nix: WebKit crashes when it inherits the
    # Nix dev shell's library paths. Only dx needs the shell.
    - name: Create the dx wrapper
      run: |
        cat > "$RUNNER_TEMP/dx-nix" <<'EOF'
        #!/usr/bin/env bash
        exec nix develop "$GITHUB_WORKSPACE" --command dx "$@"
        EOF
        chmod +x "$RUNNER_TEMP/dx-nix"

    - name: Run Playwright
      working-directory: ui/tests
      env:
        CI: "true"
        DX_BIN: ${{ runner.temp }}/dx-nix
      run: |
        if [ -n "${{ inputs.project }}" ]; then
          npx playwright test --project="${{ inputs.project }}"
        else
          npx playwright test
        fi

    - name: Upload Playwright report
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: playwright-report
        path: |
          ui/tests/playwright-report
          ui/tests/test-results
        retention-days: 7
