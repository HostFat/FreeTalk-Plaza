name: Rust

on:
  push:
    branches: [ "trunk" ]
  pull_request:
    branches: [ "trunk" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
    - name: Build contract and delegate WASMs into their committed locations
      run: nix develop --command cargo run --quiet --manifest-path tools/wasm-tool/Cargo.toml -- sync
    - name: Check the delegate registry
      run: |
        BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
        nix develop --command cargo run --quiet --manifest-path tools/wasm-tool/Cargo.toml -- check --ci "$BASE" "${{ github.sha }}"
    - name: Prebuild tailwind
      run: |
        nix develop --command npm --prefix ui install
        nix develop --command npm --prefix ui run build:css
    - name: Build
      run: nix develop --command cargo build --verbose --release
    - name: Run tests
      run: nix develop --command cargo test --verbose
    - name: Build UI with dioxus
      run: nix develop --command dx build --package freetalk-ui --release
    - name: Upload board_contract.wasm
      uses: actions/upload-artifact@v4
      with:
        name: board_contract.wasm
        path: ui/public/contracts/board_contract.wasm
    - name: Upload freetalk_delegate.wasm
      uses: actions/upload-artifact@v4
      with:
        name: freetalk_delegate.wasm
        path: ui/public/contracts/freetalk_delegate.wasm
    - name: Upload styles.css
      uses: actions/upload-artifact@v4
      with:
        name: styles.css
        path: ui/assets/styles.css
    - name: Upload UI dist
      uses: actions/upload-artifact@v4
      with:
        name: freetalk-ui
        path: target/dx/freetalk-ui/release/web/public
