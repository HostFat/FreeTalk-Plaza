[package]
name = "board-contract"
version = "0.1.0"
edition = "2021"

[dependencies]
ciborium.workspace = true
ed25519-dalek.workspace = true
# Optional: cleaner ed25519 implementation for WASM
ed25519-compact = { workspace = true, optional = true }
# Dependencies for pure ed25519 verification
curve25519-dalek.workspace = true
sha2.workspace = true
rand.workspace = true
getrandom.workspace = true
freenet-stdlib.workspace = true
freenet-scaffold.workspace = true
river-core.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["freenet-main-contract"]
contract = ["freenet-stdlib/contract"]
freenet-main-contract = []
trace = ["freenet-stdlib/trace"]
# Use ed25519-compact for WASM builds to avoid getrandom contamination
wasm-crypto = ["ed25519-compact"]

[dev-dependencies]
anyhow = "1.0"
# Current node release. Must match the freenet-stdlib line in the workspace,
# otherwise the test binary links two stdlib copies and fails on duplicate
# `__frnt_set_id` symbols.
freenet = "0.2.156"
# The integration harness drives a node over the WebSocket client API, which
# lives behind `net` in freenet-stdlib. Resolver v2 keeps this test-only feature
# out of the wasm32 contract build (verified by re-hashing the WASM).
freenet-stdlib = { workspace = true, features = ["net"] }
once_cell.workspace = true
tempfile = "3.0"
testresult = "0.4"
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = "0.27"
tracing.workspace = true
tracing-subscriber = "0.3"
