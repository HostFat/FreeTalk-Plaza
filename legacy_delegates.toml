# Legacy Delegate Registry
#
# Single source of truth for every delegate generation that may still hold a
# user's boards. A delegate's address is BLAKE3(BLAKE3(wasm) || params), so any
# change to the delegate WASM re-keys it and the new generation starts with an
# EMPTY secret store. Recording the keys here is what lets the UI find data
# written by a previous build instead of silently orphaning it.
#
# Fields:
#   code_hash    = BLAKE3 hash of the raw delegate WASM bytes (hex)
#   delegate_key = BLAKE3(code_hash_bytes) - the delegate key (hex)
#
# The Rust side (ui/build.rs) turns every entry into the LEGACY_DELEGATES const,
# so adding an entry here is enough - do not edit chat_delegate.rs by hand.
#
# To add an entry:   cargo make add-migration
# To validate:       cargo make check-migration
# To rebuild WASMs:  cargo make sync-wasm
#
# The last entry is the current baseline. When the committed WASM changes, the
# previous entry must stay in this file or CI fails.

