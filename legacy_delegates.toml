# Legacy Delegate Registry
#
# Single source of truth for every board-delegate generation that may still
# hold a user's boards. A delegate's address is BLAKE3(BLAKE3(wasm) || params).
# The UI skips the entry whose key matches the delegate in this build, so the
# current baseline is not probed as a legacy store.
#
# Fields:
#   code_hash    = BLAKE3 hash of the raw delegate WASM bytes (hex)
#   delegate_key = BLAKE3(code_hash_bytes) - the delegate key (hex)
#
# The Rust side (ui/build.rs) turns every entry into the LEGACY_DELEGATES const.
#
# To add an entry:   cargo make add-migration
# To validate:       cargo make check-migration
# To rebuild WASMs:  cargo make sync-wasm

[[entry]]
version = "V2"
description = "Reproducible path-remapped board delegate baseline"
date = "2026-11-26"
delegate_key = "f2e08cd9c188d3f3019b07d00d78e369374dd87592be1ff2aa7ce27b5da85107"
code_hash = "ba951edab317f5709156c51d87397d0a1b8db7c981873ca61c0bffe53bd39724"

