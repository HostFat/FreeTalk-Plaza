[application]

# App (Project) Name
name = "chatui"

# Dioxus App Default Platform
# web, desktop, fullstack
default_platform = "web"

# `build` & `serve` dist path
out_dir = "dist"

# resource (assets) file folder
asset_dir = "assets"

[web.app]

# The asset prefix (`base_path`) is supplied at build time: `deploy-tool`
# runs `dx build --release --base-path /v1/contract/web/<id>/` with the
# project's web-container contract id, which it derives from the signing key.
# Do not pin an id here: it belongs to the deployment, not to the repo. For a
# manual build pass the same flag to `dx build`.

# HTML title tag content
title = "FreeTalk Plaza"

[web.watcher]

# when watcher trigger, regenerate the `index.html`
reload_html = true

# which files or dirs will be watcher monitoring
watch_path = ["src", "assets"]

# include `assets` in web platform
[web.resource]

# CSS style file
#style = ["bulma.min.css", "main.css", "fontawesome/css/all.min.css"]

# Javascript code file
script = []

# Static files to be included in the project
include = []

[web.resource.dev]

# Javascript code file
# serve: [dev-server] only
script = []


